<VirtualHost *:8176>
    ServerName _

    Alias /static/ /usr/share/qlever-ui/static/
    <Directory /usr/share/qlever-ui/static/>
        Require all granted
    </Directory>

    # Preserves `Host` header
    ProxyPreserveHost On
    ProxyPass /static/ !
    # Sets `X-Forwarded-For`, `X-Forwarded-Host` and `X-Forwarded-Server`
    ProxyPass / unix:/run/qlever-ui/qlever-ui.sock|http://localhost/
    ProxyPassReverse / unix:/run/qlever-ui/qlever-ui.sock|http://localhost/

    ProxyTimeout 120
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"

</VirtualHost>
